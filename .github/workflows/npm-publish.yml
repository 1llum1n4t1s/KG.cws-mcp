name: Publish to npm

# npm publish は npm Trusted Publishing の OIDC 認証を使う。
# 発火: release/x.y.z ブランチの push、または手動実行。

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pnpm セットアップ
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: OIDC対応npm CLIを準備
        run: npm install --global npm@11.19.1

      # release/x.y.z ブランチ名と package.json の version が一致するか検証。
      # bump 忘れ・誤ブランチによる二重 publish / 誤バージョン公開を発火前に止める。
      - name: Verify release branch matches package.json version
        if: startsWith(github.ref_name, 'release/')
        run: |
          BR="${GITHUB_REF_NAME#release/}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$BR" != "$PKG" ]; then
            echo "::error::Release branch '$BR' does not match package.json version '$PKG'"
            exit 1
          fi
          echo "Release branch and package.json agree on $PKG"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org/
