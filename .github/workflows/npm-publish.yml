name: Publish to npm

# 公開は native C# / .NET / cosign（PowerShell入口）と npm Trusted Publishing の OIDC 認証を使う。
# 発火: release/x.y.z ブランチの push、または手動実行。

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Prepare verified Bun build toolchain
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bun-linux-x64-baseline.zip"
          curl --fail --location --retry 3 -o "$archive" https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64-baseline.zip
          echo 'e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76  '"$archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/bun"
          "$RUNNER_TEMP/bun/bun-linux-x64-baseline/bun" --version | grep -x '1.4.4'
          echo "$RUNNER_TEMP/bun/bun-linux-x64-baseline" >> "$GITHUB_PATH"

      - name: Verify release branch matches package.json version
        if: startsWith(github.ref_name, 'release/')
        run: |
          BR="${GITHUB_REF_NAME#release/}"
          PKG=$(bun -p "require('./package.json').version")
          if [ "$BR" != "$PKG" ]; then
            echo "::error::Release branch '$BR' does not match package.json version '$PKG'"
            exit 1
          fi
          echo "Release branch and package.json agree on $PKG"

      - name: Install dependencies
        run: bun install --frozen-lockfile --no-save

      - name: Build
        run: bun --bun run build

      - name: Pack and verify release artifact
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'cws-release'
          New-Item -ItemType Directory -Path $output | Out-Null
          $archive = bun pm pack --destination $output --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Bun pack failed' }
          $verified = ./scripts/Verify-BunPackage.ps1 -PackageFile $archive
          "PACKED_TARBALL=$($verified.PackageFile)" >> $env:GITHUB_ENV
          "PACKED_INTEGRITY=$($verified.Integrity)" >> $env:GITHUB_ENV
      - name: Validate native npm publisher contracts
        shell: pwsh
        run: ./scripts/Test-NpmPublisher.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'npm-publisher-contracts')
      - name: Validate verified archive offline
        shell: pwsh
        run: ./scripts/Test-VerifiedNpmArchive.ps1 -PackageFile $env:PACKED_TARBALL -WorkDirectory (Join-Path $env:RUNNER_TEMP 'cws-offline-archive-tests')
      - name: Publish with native OIDC
        shell: pwsh
        run: ./scripts/Publish-Npm.ps1 -PackageFile $env:PACKED_TARBALL -ExpectedIntegrity $env:PACKED_INTEGRITY
